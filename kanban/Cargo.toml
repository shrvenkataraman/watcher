[package]
name = "watcher-kanban"
version = "0.1.0"
edition = "2024"

[lib]
name = "kanban"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"

[[bin]]
name = "watcher-kanban"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"
